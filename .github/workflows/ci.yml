name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Typecheck & Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit & MCP integration tests
        run: npm test

      - name: Verify compiled CLI & MCP runtime smoke check
        run: |
          node packages/cli/dist/cli.js map . --json | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (!data.totalFiles || data.totalFiles < 10) process.exit(1);
            console.log('CLI smoke OK:', data.repoName, data.totalFiles, 'files,', data.totalSymbols, 'symbols');
          "

  runtime-compat:
    name: Compiled Runtime Smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        node: ['18', '20']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install & build
        run: npm ci && npm run build

      - name: Run compiled CLI on Node ${{ matrix.node }}
        run: |
          node packages/cli/dist/cli.js map . --json | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (!data.totalFiles) process.exit(1);
            console.log('Node ' + process.version + ' runtime OK:', data.totalFiles, 'files');
          "

  macos-hud:
    name: Build Native macOS Floating HUD (Swift)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile native CodeSight.app
        run: bash apps/macos-hud/build.sh

      - name: Verify app bundle binary
        run: |
          test -x apps/macos-hud/dist/CodeSight.app/Contents/MacOS/CodeSight
          file apps/macos-hud/dist/CodeSight.app/Contents/MacOS/CodeSight
