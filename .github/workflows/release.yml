name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (e.g. v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install, build, typecheck & test
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

  package-macos-hud:
    name: Package Native macOS HUD (arm64)
    runs-on: macos-15
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build CodeSight.app
        run: bash apps/macos-hud/build.sh

      - name: Zip CodeSight.app
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            apps/macos-hud/dist/CodeSight.app \
            release-assets/CodeSight-macOS-arm64.zip
          shasum -a 256 release-assets/CodeSight-macOS-arm64.zip > release-assets/SHA256SUMS.txt

      - name: Upload macOS HUD artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-hud-assets
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, package-macos-hud]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS HUD artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-hud-assets
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CodeSight ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/CodeSight-macOS-arm64.zip
            release-assets/SHA256SUMS.txt
