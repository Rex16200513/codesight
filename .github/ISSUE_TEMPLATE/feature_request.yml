name: Feature Request
description: Suggest a new language parser, AI host integration, wireframe block, or UX improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What workflow or pain point would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you'd like CodeSight to behave.
    validations:
      required: true
